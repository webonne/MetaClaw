<title>智能排障 · 故障工作台</title>
<style>
  :root{
    --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#F1F4F7; --surface-3:#E7EBEF;
    --ink:#0F1620; --ink-2:#33404E; --muted:#5B6672; --faint:#8895A2;
    --line:#DDE2E8; --line-strong:#C7CFD8;
    --accent:#0E8A8F; --accent-soft:#DCEFEF;
    --p0:#CF3B3B; --p0-soft:#FBE7E7; --p1:#C9741E; --p1-soft:#FBEEDD; --p2:#B8971F; --p2-soft:#F7F0D8; --p3:#5E7A94;
    --ok:#2E7D5B; --ok-soft:#E1F0E8; --warn:#C9741E; --warn-soft:#FBEEDD; --crit:#CF3B3B; --crit-soft:#FBE7E7;
    --contact:#4E63C4; --contact-soft:#E7EAF8;
    --shadow:0 1px 2px rgba(15,22,32,.06),0 10px 28px rgba(15,22,32,.07);
    --shadow-sm:0 1px 2px rgba(15,22,32,.06);
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: dark){:root{
    --paper:#0A0F14; --surface:#121A22; --surface-2:#0E151C; --surface-3:#1B2530;
    --ink:#E7ECF1; --ink-2:#C2CCD6; --muted:#8B98A6; --faint:#5F6D7B;
    --line:#212C36; --line-strong:#33424E; --accent:#2FB6BB; --accent-soft:#0F2C2D;
    --p0:#E4655F; --p0-soft:#2A1615; --p1:#DF9A4F; --p1-soft:#241A0F; --p2:#D3B24A; --p2-soft:#20200F; --p3:#7C97AC;
    --ok:#4FB587; --ok-soft:#10241B; --warn:#DF9A4F; --warn-soft:#241A0F; --crit:#E4655F; --crit-soft:#2A1615;
    --contact:#8B97E6; --contact-soft:#191C30;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --paper:#0A0F14; --surface:#121A22; --surface-2:#0E151C; --surface-3:#1B2530;
    --ink:#E7ECF1; --ink-2:#C2CCD6; --muted:#8B98A6; --faint:#5F6D7B;
    --line:#212C36; --line-strong:#33424E; --accent:#2FB6BB; --accent-soft:#0F2C2D;
    --p0:#E4655F; --p0-soft:#2A1615; --p1:#DF9A4F; --p1-soft:#241A0F; --p2:#D3B24A; --p2-soft:#20200F; --p3:#7C97AC;
    --ok:#4FB587; --ok-soft:#10241B; --warn:#DF9A4F; --warn-soft:#241A0F; --crit:#E4655F; --crit-soft:#2A1615;
    --contact:#8B97E6; --contact-soft:#191C30;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#F1F4F7; --surface-3:#E7EBEF;
    --ink:#0F1620; --ink-2:#33404E; --muted:#5B6672; --faint:#8895A2;
    --line:#DDE2E8; --line-strong:#C7CFD8; --accent:#0E8A8F; --accent-soft:#DCEFEF;
    --p0:#CF3B3B; --p0-soft:#FBE7E7; --p1:#C9741E; --p1-soft:#FBEEDD; --p2:#B8971F; --p2-soft:#F7F0D8; --p3:#5E7A94;
    --ok:#2E7D5B; --ok-soft:#E1F0E8; --warn:#C9741E; --warn-soft:#FBEEDD; --crit:#CF3B3B; --crit-soft:#FBE7E7;
    --contact:#4E63C4; --contact-soft:#E7EAF8;
    --shadow:0 1px 2px rgba(15,22,32,.06),0 10px 28px rgba(15,22,32,.07); --shadow-sm:0 1px 2px rgba(15,22,32,.06);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
  .wrap{max-width:960px;margin:0 auto;padding:24px 18px 80px}

  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;
    padding:7px 13px;font-size:13px;font-weight:600;transition:.12s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.06);color:#fff}
  .btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}.btn.danger:hover{filter:brightness(1.05);color:#fff}
  .btn.ghost{background:transparent}.btn.sm{padding:4px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- LIST VIEW ---------- */
  .apphead{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin-bottom:4px}
  .apphead h1{font-size:20px;font-weight:730;margin:0;letter-spacing:-.3px}
  .apphead .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
    font-weight:700;border:1px solid var(--accent);border-radius:5px;padding:1px 7px}
  .apphead p{width:100%;margin:2px 0 0;color:var(--muted);font-size:13.5px}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
  @media(max-width:640px){.summary{grid-template-columns:repeat(2,1fr)}}
  .sc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow-sm)}
  .sc .n{font-family:var(--mono);font-weight:750;font-size:26px;line-height:1;letter-spacing:-.5px}
  .sc .l{font-size:12px;color:var(--muted);margin-top:6px}
  .sc.crit .n{color:var(--crit)} .sc.warn .n{color:var(--warn)} .sc.ok .n{color:var(--ok)}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tab{border:none;background:transparent;color:var(--muted);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600}
  .tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
  .tab .c{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:5px}
  .search{margin-left:auto;position:relative}
  .search input{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);
    border-radius:9px;padding:8px 12px 8px 32px;width:200px}
  .search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px}

  .sysSel{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-strong);border-radius:9px;padding:7px 11px;cursor:pointer}
  .syschip{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border:1px solid transparent;border-radius:5px;padding:1px 6px;white-space:nowrap}
  .card .ec.light{color:var(--muted);background:var(--surface-3)}
  .list{display:grid;gap:9px}
  .card{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:13px 16px 13px 18px;cursor:pointer;transition:.13s;
    box-shadow:var(--shadow-sm)}
  .card:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
  .card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--sevc)}
  .card .sv{grid-row:1;font-family:var(--mono);font-weight:800;font-size:11px;color:#fff;background:var(--sevc);
    border-radius:5px;padding:2px 8px;align-self:center}
  .card .main{grid-row:1;min-width:0}
  .card .ttl{font-weight:670;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .ec{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border-radius:4px;padding:1px 6px}
  .card .sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px 14px;flex-wrap:wrap}
  .card .sub b{color:var(--ink-2);font-weight:600}
  .card .right{grid-row:1;display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center}
  .pill{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap;
    border:1px solid var(--line-strong);color:var(--muted);background:var(--surface-2)}
  .pill.diag{color:var(--accent);background:var(--accent-soft);border-color:transparent}
  .pill.todo{color:var(--crit);background:var(--crit-soft);border-color:transparent}
  .pill.confirmed{color:var(--ok);background:var(--ok-soft);border-color:transparent}
  .pill.closed{color:var(--muted);background:var(--surface-3);border-color:transparent}
  .card .sla{font-family:var(--mono);font-size:12px;font-weight:700}
  .card .sla.hot{color:var(--crit)} .card .sla.mid{color:var(--warn)} .card .sla.cool{color:var(--muted)}
  .empty-list{text-align:center;color:var(--faint);padding:40px 0;font-size:13.5px}

  /* ---------- DETAIL VIEW (版式 A) ---------- */
  #detailView{display:none}
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .console{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .ihead{position:relative;padding:16px 20px 15px;background:var(--surface);border-bottom:1px solid var(--line)}
  .ihead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sevc)}
  .ihead .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ihead .svb{font-family:var(--mono);font-weight:800;font-size:12px;color:#fff;background:var(--sevc);border-radius:6px;padding:3px 9px}
  .ihead h2{font-size:17px;font-weight:720;margin:0;letter-spacing:-.2px}
  .ihead .ecb{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
  .status{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700;border-radius:20px;padding:3px 12px;
    border:1px solid var(--line-strong);color:var(--muted);background:var(--surface-2);white-space:nowrap}
  .status.diag{color:var(--accent);background:var(--accent-soft);border-color:transparent}
  .status.todo{color:var(--crit);background:var(--crit-soft);border-color:transparent}
  .status.confirmed{color:var(--ok);background:var(--ok-soft);border-color:transparent}
  .status.closed{color:var(--muted);background:var(--surface-3);border-color:transparent}
  .ihead .row2{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:11px;font-size:12.5px;color:var(--muted)}
  .ihead .row2 b{color:var(--ink-2);font-weight:600}
  .slaBig{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:700;font-size:12.5px;
    color:var(--p0);background:var(--p0-soft);border-radius:7px;padding:3px 10px}
  .slaBig .pulse{width:7px;height:7px;border-radius:50%;background:var(--p0);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .cbody{display:grid;gap:1px;background:var(--line);grid-template-columns:1fr 1fr}
  @media(max-width:720px){.cbody{grid-template-columns:1fr}}
  .panel{background:var(--surface-2);padding:16px 18px}
  .panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;
    font-family:var(--mono);margin:0 0 13px;display:flex;align-items:center;gap:8px}
  .panel h3 .cnt{color:var(--muted);background:var(--surface-3);border-radius:10px;padding:0 7px;font-size:11px}
  .concl{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:14px}
  .concl .cause{font-size:15px;font-weight:670;line-height:1.5;margin:0}
  .concl .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
  .conf{display:inline-flex;align-items:center;gap:6px;font-weight:700}
  .conf .bars{display:inline-flex;gap:2px}.conf .bars i{width:4px;height:12px;border-radius:1px;background:currentColor}
  .conf .bars i.off{background:var(--line-strong)}
  .steps{display:grid;gap:9px}
  .rstep{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .tier{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
    border-radius:5px;padding:2px 6px;white-space:nowrap;align-self:start;margin-top:2px}
  .t-auto{color:var(--muted);background:var(--surface-3)}.t-contact{color:var(--contact);background:var(--contact-soft)}
  .t-write{color:var(--crit);background:var(--crit-soft)}
  .rstep .tx{font-size:13.5px;line-height:1.45}.rstep .tx .sub2{color:var(--muted);font-size:12px;margin-top:2px}
  .rstep .tx code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .rstep.done{opacity:.72}.doneflag{font-family:var(--mono);font-size:11px;color:var(--ok);font-weight:700;white-space:nowrap}

  .ev{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}
  .ev .evh{display:grid;grid-template-columns:auto 1fr auto auto;gap:11px;align-items:center;padding:11px 13px;cursor:pointer;transition:background .12s}
  .ev .evh:hover{background:var(--surface-2)}
  .flag{width:9px;height:9px;border-radius:50%;flex:none}
  .flag.anom{background:var(--crit)}.flag.warn2{background:var(--warn)}.flag.ok{background:var(--ok)}
  .ev .ns{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--accent)}.ev .desc{font-size:13px}
  .ev .verdict{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;white-space:nowrap}
  .verdict.anom{color:var(--crit);background:var(--crit-soft)}.verdict.warn2{color:var(--warn);background:var(--warn-soft)}
  .verdict.ok{color:var(--ok);background:var(--ok-soft)}
  .ev .chev{color:var(--faint);font-size:12px;transition:transform .18s;font-family:var(--mono)}
  .ev.open .chev{transform:rotate(90deg)}
  .ev .evbody{display:none;padding:0 13px 13px;border-top:1px dashed var(--line)}.ev.open .evbody{display:block}
  .ev .evbody .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:11px 0 5px}
  pre{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);
    border-radius:8px;padding:11px 12px;overflow-x:auto;margin:0;color:var(--ink-2)}
  pre .kw{color:var(--accent);font-weight:700}pre .st{color:var(--ok)}pre .cm{color:var(--faint)}

  .tl-wrap{background:var(--surface);border-top:1px solid var(--line);padding:14px 20px 16px}
  .tl-wrap h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;font-family:var(--mono);margin:0 0 12px}
  .tl{list-style:none;margin:0;padding:0;position:relative}
  .tl::before{content:"";position:absolute;left:6px;top:5px;bottom:8px;width:2px;background:var(--line)}
  .tl li{position:relative;padding:5px 0 5px 26px;font-size:13px}
  .tl li .dot{position:absolute;left:0;top:9px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
  .tl li.done .dot{background:var(--accent)}.tl li.now .dot{border-color:var(--p0);box-shadow:0 0 0 4px var(--p0-soft)}
  .tl li.pending{color:var(--muted)}.tl li.pending .dot{border-color:var(--line-strong)}
  .tl li .tt{font-family:var(--mono);font-size:11px;color:var(--faint);margin-right:8px}
  .tl li .who{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:6px}

  .abar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px 20px;background:var(--surface);border-top:1px solid var(--line)}

  .overlay{position:fixed;inset:0;background:rgba(6,10,14,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.on{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);max-width:430px;width:100%;padding:22px;animation:pop .16s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h4{margin:0 0 6px;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:9px}
  .modal .warnico{width:26px;height:26px;border-radius:7px;background:var(--crit-soft);color:var(--crit);display:grid;place-items:center;font-size:15px;flex:none}
  .modal p{margin:0 0 6px;font-size:13px;color:var(--ink-2)}
  .modal .detail{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:12px 0;color:var(--ink-2);line-height:1.6}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
  .modal textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;resize:vertical}
  .modal .foot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
  #toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;pointer-events:none}
  .toast{background:var(--ink);color:var(--surface);font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;animation:tin .2s ease-out}
  .toast .ic{color:var(--ok)}@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
  .foot-note{margin-top:22px;font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center}
</style>

<div class="wrap">
  <!-- ============ LIST VIEW ============ -->
  <div id="listView">
    <div class="apphead">
      <h1>故障工作台</h1><span class="tag">列表页 · 详情入口</span>
      <p>值班总览：按<b>系统</b> / 级别 / 状态筛选，点任一故障进入详情页（版式 A）处置。多系统接入，路由键为 <span class="mono">(system, error_code)</span>。</p>
    </div>

    <div class="summary">
      <div class="sc crit"><div class="n" id="scP0">2</div><div class="l">P0 未闭环</div></div>
      <div class="sc warn"><div class="n" id="scActive">4</div><div class="l">处置中 / 待处理</div></div>
      <div class="sc"><div class="n mono" id="scMttr">6.2</div><div class="l">今日均 MTTR（分）</div></div>
      <div class="sc ok"><div class="n mono" id="scAuto">21%</div><div class="l">可自动化率</div></div>
    </div>

    <div class="toolbar">
      <select class="sysSel" id="sysSel" onchange="setSys(this.value)"></select>
      <div class="tabs" id="tabs">
        <button class="tab on" data-f="all">全部 <span class="c" id="cAll"></span></button>
        <button class="tab" data-f="P0">P0 <span class="c" id="cP0"></span></button>
        <button class="tab" data-f="todo">待处理 <span class="c" id="cTodo"></span></button>
        <button class="tab" data-f="diag">处置中 <span class="c" id="cDiag"></span></button>
      </div>
      <div class="search"><input id="q" placeholder="搜错误码 / 服务" oninput="renderList()"></div>
    </div>

    <div class="list" id="list"></div>
  </div>

  <!-- ============ DETAIL VIEW ============ -->
  <div id="detailView">
    <div class="backbar">
      <button class="btn ghost sm" onclick="back()">← 返回工作台</button>
      <span class="mono" style="font-size:12px;color:var(--faint)" id="crumb"></span>
    </div>
    <div class="console" id="detail"></div>

    $('#crumb').textContent='工作台 / '+it.sys+' / '+(it.light?'轻接入':it.ecode)+' '+it.title;
    $('#detail').innerHTML=`
      <div class="ihead" style="--sevc:${sevColor[it.sev]}">
        <div class="row1"><span class="svb">${it.sev}</span><span class="syschip">${it.sys}</span><h2>${it.service} · ${it.title}</h2>
          <span class="ecb"${it.light?' style="color:var(--muted);background:var(--surface-3)"':''}>${it.light?'轻接入·无码':it.ecode}</span>
          <span class="status ${it.st}" id="stPill">${stLabel[it.st]}</span></div>
        <div class="row2">
          ${it.sla!=='—'?`<span class="slaBig"><span class="pulse"></span>SLA 剩余 <span id="slaBig" class="mono">${it.sla}</span></span>`:'<span class="mono" style="color:var(--muted)">外部依赖 · 无 SLA 计时</span>'}
          <span><b>系统</b> ${it.sys}${it.light?' · 轻接入·LLM 分诊':''}</span>
          <span><b>影响</b> ${it.impact}</span><span><b>类型</b> ${it.type}</span><span><b>trace</b> <span class="mono">${it.trace}</span></span>
        </div>
      </div>
      <div class="cbody">
        <div class="panel">
          <h3>诊断结论</h3>
          <div class="concl"><p class="cause">${it.cause}</p>
            <div class="meta"><span class="conf" style="color:${cc}"><span class="bars">${confBars(it.confN)}</span> 置信度 ${it.conf}</span>
            <span>命中 SOP <span class="mono">${it.sop}</span></span></div></div>
          <h3 style="margin-top:4px">推荐路径 · 恢复动作三分级</h3>
          <div class="steps">${it.steps.map(s=>`
            <div class="rstep ${s.done?'done':''}"><span class="tier t-${s.tier}">${s.tl}</span>
              <div class="tx">${s.tx}<div class="sub2">${s.sub}</div></div>
              ${s.done?'<span class="doneflag">✓ 已完成</span>':s.write?'<button class="btn danger sm" onclick="openWrite()">待确认 ⚠</button>':`<button class="btn sm" onclick="toast('${s.actMsg}','ic')">${s.act}</button>`}
            </div>`).join('')}</div>
        </div>
        <div class="panel">
          <h3>证据看板 <span class="cnt">${it.ev.length} 项 · ${anom} 异常</span></h3>
          ${it.ev.map((e,i)=>`
            <div class="ev ${i===0?'open':''}"><div class="evh" onclick="this.closest('.ev').classList.toggle('open')">
              <span class="flag ${e.f}"></span><span><span class="ns">${e.ns}</span> <span class="desc">${e.d}</span></span>
              <span class="verdict ${e.f}">${e.v}</span><span class="chev">▸</span></div>
              <div class="evbody"><div class="lbl">执行的 DQL</div><pre>${e.dql}</pre>
                ${e.ml?`<div class="lbl">${e.ml}</div><pre>${e.mp}</pre>`:''}</div></div>`).join('')}
        </div>
      </div>
      <div class="tl-wrap"><h3>处置时间线 · 自动留痕</h3><ul class="tl" id="timeline">${tlHtml(it.tl)}</ul></div>
      <div class="abar">
        <button class="btn pri sm" id="cfBtn" onclick="confirmConcl()">确认结论</button>
        <button class="btn sm" onclick="openTransfer()">转派</button>
        ${it.steps.some(s=>s.write)?'<button class="btn danger sm" onclick="openWrite()">执行写操作</button>':''}
        <button class="btn ghost sm" onclick="openClose()">关闭并沉淀</button>
      </div>`;
    $('#listView').style.display='none';$('#detailView').style.display='block';
    window.scrollTo(0,0);startSla(it);
  };
  function tlHtml(tl){return tl.map(t=>`<li class="${t.c}"><span class="dot"></span><span class="tt">${t.t}</span>${t.x}${t.w?'<span class="who">'+t.w+'</span>':''}</li>`).join('');}
  function logTL(t,x,w){const p=cur.tl.find(e=>e.c==='pending');const i=cur.tl.indexOf(p);
    cur.tl.splice(i,0,{t:t,x:x,w:w||'',c:'done'});const ul=$('#timeline');if(ul)ul.innerHTML=tlHtml(cur.tl);}

  let slaTimer=null;
  function startSla(it){
    if(slaTimer)clearInterval(slaTimer);
    const el=document.getElementById('slaBig');if(!el||it.sla.indexOf(':')<0||it.sla.split(':').length>2)return;
    let parts=it.sla.split(':').map(Number),sec=parts[0]*60+parts[1];
    slaTimer=setInterval(()=>{sec--;if(sec<0){clearInterval(slaTimer);return;}
      el.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');},1000);
  }
  window.back=function(){if(slaTimer)clearInterval(slaTimer);$('#detailView').style.display='none';
    $('#listView').style.display='block';renderList();window.scrollTo(0,0);};

  window.confirmConcl=function(){cur.st='confirmed';const p=$('#stPill');if(p){p.className='status confirmed';p.textContent='已确认';}
    const b=$('#cfBtn');if(b){b.textContent='已确认';b.disabled=true;}logTL('14:19:02','一线确认诊断结论','当班·人工');toast('已确认结论，记入时间线','ic');};

  const overlay=$('#overlay'),modal=$('#modal');
  function openOverlay(){overlay.classList.add('on');}
  window.closeOverlay=()=>overlay.classList.remove('on');
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeOverlay();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();});

  window.openWrite=function(){modal.innerHTML=`<h4><span class="warnico">⚠</span>确认执行写操作</h4>
    <p>该操作为<b>生产写操作</b>，可能造成短暂中断，执行将自动留痕。</p>
    <div class="detail">服务　 ${cur.service}<br>依据　 SOP ${cur.sop}</div>
    <label>确认原因（记入审计）</label><textarea rows="2" id="wr" placeholder="填写确认理由"></textarea>
    <div class="foot"><button class="btn ghost sm" onclick="closeOverlay()">取消</button><button class="btn danger sm" onclick="doWrite()">确认执行</button></div>`;openOverlay();};
  window.doWrite=function(){const r=($('#wr').value||'').trim();closeOverlay();logTL('14:19:20','执行写操作'+(r?('（'+r+'）'):''),'当班·人工·已留痕');toast('写操作已执行并留痕','ic');};

  window.openTransfer=function(){modal.innerHTML=`<h4>结构化转派</h4><p>整份故障上下文随工单流转，接手方无需重新排查。</p>
    <div class="detail">error_code　 ${cur.ecode}<br>trace_id　　 ${cur.trace}<br>已确认证据　 ✓ 随工单携带</div>
    <div class="foot"><button class="btn ghost sm" onclick="closeOverlay()">取消</button><button class="btn pri sm" onclick="doTransfer()">转派并同步群</button></div>`;openOverlay();};
  window.doTransfer=function(){closeOverlay();const p=$('#stPill');if(p){p.className='status';p.textContent='已转派';}logTL('14:19:12','转派（携带完整上下文）','当班·人工');toast('已转派，上下文随工单同步','ic');};

  window.openClose=function(){modal.innerHTML=`<h4>关闭并沉淀</h4><p>处置过程将归档；可顺手修正 SOP 使其更准。</p>
    <div class="detail">命中 SOP　 ${cur.sop}</div>
    <label>修正 / 补充 SOP（可选 · 写回知识库）</label><textarea rows="2" id="sn" placeholder="例：补充 anomaly_criteria，减少误报"></textarea>
    <div class="foot"><button class="btn ghost sm" onclick="doClose(false)">仅归档</button><button class="btn pri sm" onclick="doClose(true)">关闭并写回 SOP</button></div>`;openOverlay();};
  window.doClose=function(wb){const n=($('#sn')&&$('#sn').value||'').trim();closeOverlay();cur.st='closed';
    const p=$('#stPill');if(p){p.className='status closed';p.textContent='已关闭';}logTL('14:24:10','关闭工单，过程归档','当班·人工');
    if(wb&&n)logTL('14:24:11','SOP 候选修正提交审核','闭环·Evolver');toast(wb?'已关闭，SOP 修正进入审核队列':'已归档关闭','ic');};

  initSysSel();renderList();
})();
</script>
